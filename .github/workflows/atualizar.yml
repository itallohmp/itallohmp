name: atualizar estatísticas

on:
  schedule:
    - cron: "17 9 * * *" # todo dia, 06:17 no horário de Brasília
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/**"]

permissions:
  contents: write

concurrency:
  group: atualizar
  cancel-in-progress: false

jobs:
  gerar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: gerar as imagens
        env:
          GH_TOKEN: ${{ secrets.PERFIL_TOKEN }}
        run: python scripts/gerar.py
      - name: gravar se mudou
        run: |
          if [ -z "$(git status --porcelain assets)" ]; then
            echo "nada mudou"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git commit -m "chore: atualiza as estatísticas"
          git push
